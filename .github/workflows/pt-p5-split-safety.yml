name: Portugal P5 Split Safety
on:
  push:
    paths:
      - backend/pt_split.py
      - backend/p5_checkout.py
      - backend/p5_rules.py
      - backend/routes_payments.py
      - backend/server.py
      - backend/tests/test_pt_split.py
      - backend/tests/test_p5_rules.py
      - .github/workflows/pt-p5-split-safety.yml
  workflow_dispatch:

jobs:
  portugal-split-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: backend
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: rrclub_test
      JWT_SECRET: ci-no-real-secrets
      STRIPE_SECRET_KEY: sk_test_dummy
      P5_ENABLED: 'false'
      P5_EUR_ENABLED: 'false'
      PT_SPLIT_ENABLED: 'false'
      PT_SPLIT_LIVE_ENABLED: 'false'
      PT_SPLIT_AUTO_TRANSFER: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install financial module test dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 starlette==0.37.2 motor==3.3.1 pymongo==4.6.3 stripe==14.4.1 bcrypt==4.1.3 PyJWT==2.13.0 pydantic==2.13.5
      - name: Check syntax
        run: python -m compileall -q backend
      - name: Test financial math and safety flags
        run: python -m unittest discover -s backend/tests -p 'test_pt_split.py' -v
      - name: Test P5 Portugal and Brasil quote
        run: python -m unittest discover -s backend/tests -p 'test_p5_rules.py' -v
      - name: Static signed-webhook and anti-legacy checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("backend/pt_split.py").read_text()
          p=Path("backend/p5_checkout.py").read_text()
          r=Path("backend/routes_payments.py").read_text()
          assert 'split_version": VERSION' in p
          assert '"payment_status": "paid"' in s
          assert '"kind": "coupon_pay"' in s and '"currency": "eur"' in s
          assert "source_transaction=charge_id" in s
          assert "idempotency_key=f" in s
          assert "PT_SPLIT_AUTO_TRANSFER" in s
          assert "stripe.Webhook.construct_event" in r
          assert 'await settle_webhook_safely(obj["id"])' in r
          assert "PT_SPLIT_LIVE_ENABLED" in s
          print("Portuguese split is guarded, double-recipient, webhook-only.")
          PY
