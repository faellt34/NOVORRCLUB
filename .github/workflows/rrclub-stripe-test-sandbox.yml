name: RRClub Clone - Real Stripe Test Sandbox

on:
  push:
    branches:
      - BRANCH-copia-editar-a-vontade
    paths:
      - '.github/workflows/rrclub-stripe-test-sandbox.yml'
      - 'backend/scripts/stripe_sandbox_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-test-only:
    if: github.ref == 'refs/heads/BRANCH-copia-editar-a-vontade'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # GitHub Secrets/Variables. Never paste secret keys in ChatGPT or commit them.
      RRCLUB_STRIPE_PT_TEST_KEY: ${{ secrets.RRCLUB_STRIPE_PT_TEST_KEY }}
      RRCLUB_STRIPE_BR_TEST_KEY: ${{ secrets.RRCLUB_STRIPE_BR_TEST_KEY }}
      RRCLUB_STRIPE_BR_TEST_PMC: ${{ vars.RRCLUB_STRIPE_BR_TEST_PMC }}
    steps:
      - name: Checkout clone only
        uses: actions/checkout@v4

      - name: Check sandbox credentials without revealing them
        id: preflight
        shell: bash
        run: |
          if [[ "$RRCLUB_STRIPE_PT_TEST_KEY" != sk_test_????????????????????* ||
                "$RRCLUB_STRIPE_BR_TEST_KEY" != sk_test_????????????????????* ||
                "$RRCLUB_STRIPE_BR_TEST_PMC" != pmc_* ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NOT RUN: test-mode PT/BR keys and Pix test configuration must be added as GitHub secrets/variable."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Test-mode sandbox credentials found. No live keys permitted."
          fi

      - name: Python test tooling
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stripe SDK
        if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install stripe==15.6.0

      - name: Verify real test accounts and create-expire test Checkouts
        if: steps.preflight.outputs.ready == 'true'
        working-directory: backend
        run: python scripts/stripe_sandbox_probe.py
