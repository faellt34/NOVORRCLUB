name: RRClub Pix Sandbox Safety

on:
  push:
    branches:
      - fix/pix-brl-checkout
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/pix-sandbox-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install pytest==9.1.1 stripe==14.4.1
      - name: Compile checkout and server
        run: python -m compileall -q backend/pix_checkout_logic.py backend/routes_pix.py backend/server.py
      - name: Test payment safety without money movement
        run: |
          python -m pytest -q             backend/tests/test_payment_regions.py             backend/tests/test_stripe_platform.py             backend/tests/test_connect_identity.py             backend/tests/test_pix_split.py             backend/tests/test_pix_checkout_logic.py
