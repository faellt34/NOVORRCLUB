name: RRClub Pix Sandbox Safety

on:
  push:
    branches:
      - fix/pix-brl-checkout
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/pix-sandbox-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install pytest==9.1.1 pytest-xdist==3.8.0 stripe==14.4.1
      - name: Compile checkout and server
        run: python -m compileall -q backend/pix_checkout_logic.py backend/routes_pix.py backend/server.py backend/campaign_guardrails.py backend/routes_admin.py backend/routes_payments.py backend/pix_readiness.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse admin JSX without installing entire frontend
        run: |
          mkdir -p /tmp/rrclub-jsparse
          npm install --prefix /tmp/rrclub-jsparse --no-fund --no-audit @babel/parser@7.28.5
          node -e "const fs=require('fs'); const p=require('/tmp/rrclub-jsparse/node_modules/@babel/parser'); p.parse(fs.readFileSync('frontend/src/pages/AdminManage.jsx','utf8'),{sourceType:'module',plugins:['jsx']}); p.parse(fs.readFileSync('frontend/src/pages/PublicCoupon.jsx','utf8'),{sourceType:'module',plugins:['jsx']}); console.log('Admin and Coupon JSX syntax OK')"
      - name: Test payment safety without money movement
        run: |
          python -m pytest -q             backend/tests/test_payment_regions.py             backend/tests/test_stripe_platform.py             backend/tests/test_connect_identity.py             backend/tests/test_pix_split.py             backend/tests/test_pix_checkout_logic.py backend/tests/test_campaign_guardrails.py backend/tests/test_legacy_payment_isolation.py backend/tests/test_pix_readiness.py
