name: RRClub Brazilian Pix safety checks

on:
  push:
    branches:
      - fix/pix-br-emer-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated checkout test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 fastapi==0.110.1 pydantic==2.13.5 stripe==14.4.1 motor==3.3.1 pymongo==4.6.3 PyJWT==2.13.0 python-dotenv==1.2.3 bcrypt==4.1.3 passlib==1.7.4 python-multipart==0.0.32 boto3==1.43.85 resend==2.43.0
      - name: Syntax validation
        run: python -m compileall -q backend/routes_pix.py backend/payments/pix backend/tests/test_pix_readiness.py backend/tests/test_pix_service.py
      - name: Mocked Pix checkout and payout regression tests
        run: cd backend && python -m pytest -q tests/test_pix_service.py tests/test_pix_readiness.py
