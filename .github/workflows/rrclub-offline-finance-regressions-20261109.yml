name: RRClub offline financial regressions 2026-11-09
on:
  push:
    branches: [release/rrclub-20261109-predeploy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: rrclub_ci_offline
      JWT_SECRET: offline-ci-test-only-not-production-secret
      PIX_ENABLED: "false"
      P5_ENABLED: "false"
      PT_SPLIT_ENABLED: "false"
      PT_SPLIT_LIVE_ENABLED: "false"
      PT_SPLIT_AUTO_TRANSFER: "false"
      PIX_STRIPE_SECRET_KEY: ""
      STRIPE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies only
        run: |
          python -m pip install --disable-pip-version-check \
            "fastapi==0.110.1" "pydantic>=2,<3" "stripe==14.4.1" \
            "motor==3.3.1" "pymongo==4.6.3" "bcrypt==4.1.3" \
            "PyJWT>=2,<3" "pytest>=8,<10" "pytest-xdist>=3,<4" "httpx>=0.27,<1" \
            "python-multipart>=0.0.9" "requests>=2.31,<3"
      - name: Run mocked Pix, payout, webhook and Portuguese split regressions
        run: |
          python -m pytest -q tests/test_pix_service.py tests/test_pix_readiness.py tests/test_pt_split.py tests/test_p5_rules.py tests/test_p5_activation_policy.py tests/test_payout_attribution.py tests/test_p5_account_audit_readonly.py tests/test_p5_pt_mbway_checkout_no_downgrade.py
