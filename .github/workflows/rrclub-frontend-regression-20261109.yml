name: RRClub full frontend offline suite
on:
  push:
    branches: [release/rrclub-20261109-predeploy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  react-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      REACT_APP_BACKEND_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --legacy-peer-deps --no-audit --no-fund ajv@8.17.1
      - name: Run React/Jest tests without production or browser deployment
        run: npm test -- --watch=false --runInBand
