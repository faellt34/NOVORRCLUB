name: P5 follower synchronization regression
on:
  push:
    branches:
      - fix/p5-seguidor-sync-20261114
    paths:
      - 'frontend/src/components/P5FollowerPanel.jsx'
      - 'frontend/src/components/P5FollowerPanel.test.jsx'
      - '.github/workflows/p5-follower-sync-ci.yml'
  workflow_dispatch:
jobs:
  follower-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive
      - name: P5 follower synchronization regression
        working-directory: frontend
        env:
          CI: 'true'
        run: yarn test --watch=false --runInBand --runTestsByPath src/components/P5FollowerPanel.test.jsx
      - name: Frontend build
        working-directory: frontend
        env:
          CI: 'false'
        run: yarn build
