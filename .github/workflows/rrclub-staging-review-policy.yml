name: RRClub Staging — Permissões de Revisão
on:
  push:
    branches:
      - 'preview/rrclub-v1-isolado-20261110'
    paths:
      - 'backend/staging_review_policy.py'
      - 'backend/tests/test_staging_review_policy.py'
      - '.github/workflows/rrclub-staging-review-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-reviewer-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar permissão de acesso aos três painéis
        run: |
          python -m pip install pytest==8.3.5
          PYTHONPATH=backend python -m pytest -q backend/tests/test_staging_review_policy.py
