name: RRClub P5 expected user states
on:
  pull_request:
    branches: [integracao-google-rrclub-20261019]
  workflow_dispatch:
jobs:
  user-states:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile backend/observability.py
      - run: python -m unittest discover -s backend/tests -p 'test_p5_observability_user_states.py' -v
