<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7fb"><link rel="manifest" href="app.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>RRClub · Prévia mobile</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7e8f0;color:#171735;font:16px system-ui,sans-serif}main{max-width:480px;margin:auto;min-height:100svh;background:#f7f7fb;padding:24px 22px 110px}header,.row,nav,.tabs{display:flex;align-items:center;justify-content:space-between;gap:10px}header b{font-size:22px;letter-spacing:-1.5px}header small{font-size:12px;color:#605e76}.tabs{background:#e9e8f0;padding:4px;border-radius:16px;margin:26px 0}.tabs button{flex:1;border-radius:12px}.active{background:white;box-shadow:0 2px 7px #2221}button{border:0;background:transparent;color:inherit;font:inherit;font-weight:650;padding:12px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9866fe}h1{font-size:31px;letter-spacing:-1.5px;margin:0 0 19px}h2{font-size:18px;letter-spacing:-.5px;margin:25px 0 12px}p{line-height:1.45}small{color:#62627a}.hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(115deg,#151861,#3a2997);border-radius:25px;padding:24px;color:white}.hero:after{content:"";position:absolute;z-index:-1;width:155px;height:155px;right:-65px;top:-65px;border-radius:50%;border:20px solid #a59cff44;box-shadow:0 0 0 18px #b9b2ff22,0 0 0 36px #b9b2ff18}.hero small{color:#d8d4ff}.hero strong{display:block;font-size:28px;letter-spacing:-1px;margin:10px 0}.hero button,.primary{background:#fff;color:#241d68;border-radius:12px;margin-top:9px}.primary{background:#4434ac;color:white}.card{background:white;border:1px solid #e4e3ed;padding:17px;border-radius:18px;margin:9px 0}.card small{display:block;margin-top:4px}.tag{color:#12694e;background:#ddf5eb;border-radius:14px;padding:5px 9px;font-size:12px}.money{font-size:24px;letter-spacing:-1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .card{margin:0}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:#fffc;backdrop-filter:blur(15px);border-top:1px solid #ddd;padding:8px 9px max(9px,env(safe-area-inset-bottom))}nav button{font-size:12px;flex:1;color:#65647a}nav button[aria-current=true]{color:#4434ac;background:#eeebff;border-radius:12px}svg{width:21px;height:21px;display:block;margin:0 auto 4px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}input{padding:13px;border-radius:10px;border:1px solid #bab8cc;width:100%;font:inherit;margin:8px 0}.bar{height:6px;background:#ebeaf4;border-radius:6px;margin:6px 0 14px}.bar i{display:block;height:100%;background:#6350cb;border-radius:6px}footer{font-size:12px;color:#66647b;margin-top:22px}
</style><main><header><b>R·Conekta <small>/ RRClub</small></b><small>Prévia interativa</small></header><div class="tabs" id="roles"></div><section id="view" aria-live="polite"></section><footer>Dados ilustrativos · Portugal</footer></main><nav id="nav" aria-label="Navegação principal"></nav><script>
let role='Parceiro',page='Início',stage=0,net=0,msg='';const euro=n=>n.toLocaleString('pt-PT',{style:'currency',currency:'EUR'}),icons=['M3 10l9-7 9 7v10h-6v-7H9v7H3z','M3 9V4h5m8 0h5v5m0 6v5h-5m-8 0H3v-5M7 12h10','M4 20V9m7 11V4m7 16v-7'];const icon=i=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+icons[i]+'"/></svg>';function go(p){page=p;msg='';draw()}function choose(r){role=r;go('Início')}function card(a,b){return '<div class="card"><b>'+a+'</b><small>'+b+'</small></div>'}function draw(){const p=role==='Parceiro',tabs=['Início',p?'Leitor P5':'Campanhas',p?'Atividade':'Resultados'];roles.innerHTML=['Parceiro','Influenciador'].map(r=>'<button aria-pressed="'+(role===r)+'" class="'+(role===r?'active':'')+'" onclick="choose(this.textContent)">'+r+'</button>').join('');nav.innerHTML=tabs.map((n,i)=>'<button aria-current="'+(page===n)+'" onclick="go(this.textContent)">'+icon(i)+n+'</button>').join('');let s='';if(page==='Início'){s='<h1>'+(p?'O teu estabelecimento':'O teu estúdio')+'</h1><div class="hero"><small>'+(p?'BALCÃO P5':'CAMPANHA EM DESTAQUE')+'</small><strong>'+(p?'Validar um QR':'Sabores de Lisboa')+'</strong><p>'+(p?'Lê o código do seguidor para introduzir o valor da compra.':'Partilha o cupão e acompanha as visitas que chegam pela tua divulgação.')+'</p><button onclick="go(\''+tabs[1]+'\')">'+(p?'Abrir leitor':'Ver campanha')+' →</button></div><h2>Esta semana</h2><div class="grid">'+card('<span class="money">'+(p?'12':'248')+'</span>',p?'Vendas confirmadas':'Cliques no cupão')+card('<span class="money">'+(p?'€ 240':'€ 15')+'</span>',p?'Parcela do parceiro':'Comissões confirmadas')+'</div><h2>'+(p?'Última atividade':'Campanha ativa')+'</h2>'+card('Sabores de Lisboa',p?'Compra de € 25 · Confirmada':'5% de desconto para o seguidor');}
else if(page==='Leitor P5'){s='<h1>Leitor P5</h1>';if(!stage)s+='<div class="hero"><small>LEITURA DE EXEMPLO</small><strong>Aponta para o QR</strong><p>Na prévia, usa um cupão de exemplo para experimentar o atendimento.</p><button onclick="stage=1;draw()">Simular leitura</button></div>';else if(stage===1)s+='<form class="card" onsubmit="event.preventDefault();net=Math.round(Number(amount.value)*100);stage=2;draw()"><span class="tag">QR reconhecido</span><h2>Sabores de Lisboa</h2><label for="amount">Valor original (€)</label><input id="amount" type="number" inputmode="decimal" min=".01" max="99999" step=".01" required placeholder="100,00"><button class="primary">Confirmar valor</button></form>';else s+=card('Valor confirmado na prévia','A aguardar pagamento do seguidor')+card('Compra '+euro(net/100),'Desconto '+euro(Math.round(net*.05)/100)+' · Total a pagar '+euro((net-Math.round(net*.05))/100))+'<button onclick="stage=0;draw()">Nova leitura</button>';}
else if(page==='Campanhas'){s='<h1>Campanhas</h1><div class="hero"><small>CUPÃO · LISBOA05</small><strong>Sabores de Lisboa</strong><p>5% para o seguidor · 5% de comissão sobre a compra original</p><button onclick="shareDemo()">Partilhar campanha</button></div>'+card('Texto de divulgação',msg||'Toca em partilhar para preparar a mensagem.');}else if(page==='Resultados'){s='<h1>Resultados</h1>'+card('€ 15 em comissões','12 vendas confirmadas · Esta semana')+'<h2>Origem dos cliques</h2><div class="card">Instagram · 186<div class="bar"><i style="width:75%"></i></div>Link direto · 62<div class="bar"><i style="width:25%"></i></div></div>';}else{s='<h1>Atividade</h1>'+(stage===2?card('A aguardar pagamento','Compra simulada · '+euro(net/100)):'')+card('Venda confirmada · € 25','Sabores de Lisboa · Exemplo');}view.innerHTML=s}async function shareDemo(){const t='Descobre Sabores de Lisboa com o cupão LISBOA05 e recebe 5% de desconto. (Campanha de exemplo RRClub)';msg=t;draw();if(navigator.share)try{await navigator.share({text:t})}catch{}}draw();
</script></html>
